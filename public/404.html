<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Capitol Restaurant</title>
    <link rel="stylesheet" href="/error-pages.css" />
  </head>
  <body>
    <header class="error-header">
      <div class="error-header__inner">
        <a class="error-brand" href="/" aria-label="Capitol Restaurant home">
          <img
            class="error-brand__logo"
            src="/brand/wordmark-beige-600.png"
            alt="Capitol"
          />
          <span class="error-brand__meta">Since 1940 · Pasay City</span>
        </a>
      </div>
    </header>
    <main class="error-page">
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="error-button" href="/">Back to home</a>
    </main>
  </body>
</html>
