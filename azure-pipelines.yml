# Node.js with React
# Build a Node.js project that uses React.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

variables:
- group: supabase-secrets
- name: buildConfiguration
  value: 'production'

stages:

# =====================================
# BUILD STAGE
# =====================================
- stage: Build
  displayName: Build
  jobs:
  - deployment: Build
    displayName: Build Frontend
    environment:
      name: Staging
      resourceType: VirtualMachine

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - powershell: |
              npm install
            displayName: 'npm install'

          - powershell: |
              if ("$(VITE_SUPABASE_URL)") { Write-Host "VITE_SUPABASE_URL is SET" } else { Write-Host "VITE_SUPABASE_URL is EMPTY"; exit 1 }
              if ("$(VITE_SUPABASE_PUBLISHABLE_KEY)") { Write-Host "VITE_SUPABASE_PUBLISHABLE_KEY is SET" } else { Write-Host "VITE_SUPABASE_PUBLISHABLE_KEY is EMPTY"; exit 1 }
            displayName: 'Verify env vars'

          - powershell: |
              @"
              VITE_SUPABASE_URL=$(VITE_SUPABASE_URL)
              VITE_SUPABASE_PUBLISHABLE_KEY=$(VITE_SUPABASE_PUBLISHABLE_KEY)
              "@ | Out-File -FilePath .env -Encoding utf8
              npm run build
            displayName: 'npm run build'

          - task: PublishBuildArtifacts@1
            displayName: Publish Build Artifact
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/dist'
              ArtifactName: drop
              publishLocation: Container

# =====================================
# DEPLOY STAGE
# =====================================
- stage: Deploy
  displayName: Deploy to Staging
  dependsOn: Build

  jobs:
  - deployment: DeployToStaging
    displayName: Deploy to Staging VM

    environment:
      name: Staging
      resourceType: VirtualMachine

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: none

          - download: current
            artifact: drop

          # Verify where this job is running
          - powershell: |
              Write-Host "===== Environment Information ====="
              hostname
              $env:COMPUTERNAME
              [System.Environment]::OSVersion
              $PSVersionTable.PSVersion
            displayName: Verify Deployment Target

          # Stop IIS
          - powershell: |
              Import-Module WebAdministration
              Stop-WebSite "Default Web Site"
            displayName: Stop IIS

          # Deploy files
          - powershell: |
              $sitePath = "C:\inetpub\wwwroot"

              if (!(Test-Path $sitePath)) {
                  New-Item -ItemType Directory -Path $sitePath -Force
              }

              Remove-Item "$sitePath\*" -Recurse -Force -ErrorAction SilentlyContinue

              Copy-Item "$(Pipeline.Workspace)\drop\*" `
                        "$sitePath" `
                        -Recurse `
                        -Force

              Write-Host "Deployment completed."
            displayName: Copy Files

          # Start IIS
          - powershell: |
              Import-Module WebAdministration
              Start-WebSite "Default Web Site"
            displayName: Start IIS
